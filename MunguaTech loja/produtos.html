<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Produtos - MunguaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/carrinho.js" defer></script>
</head>
<body>
  <header class="topo">
    <h1>Produtos</h1>
  </header>

  <section class="produtos">
    <div class="produto">
      <img src="img/produto1.jpg" alt="Smartphone">
      <h2>Smartphone Android</h2>
      <p>Preço: 15.000 MZN</p>
      <button onclick="adicionarCarrinho('Smartphone Android', 15000)">Adicionar ao Carrinho</button>
    </div>

    <div class="produto">
      <img src="img/produto2.jpg" alt="Fones Bluetooth">
      <h2>Fones Bluetooth</h2>
      <p>Preço: 3.500 MZN</p>
      <button onclick="adicionarCarrinho('Fones Bluetooth', 3500)">Adicionar ao Carrinho</button>
    </div>
  </section>
</body>
</html>
